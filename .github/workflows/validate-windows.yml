name: Validate Windows build

on:
  push:
    branches:
      - build/windows-test

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Supply missing test type dependency
        run: npm install --no-save --package-lock=false vitest @tauri-apps/api@2.10.1 @tauri-apps/plugin-dialog@2.6.0 @tauri-apps/plugin-updater@2.10.1
      - name: Build Windows bundles
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: tiez-windows-webdav-escape-fix
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
